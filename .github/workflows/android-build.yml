name: Android preview build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source and engine submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download public Java 8 runtime asset
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Generate language list
        run: bash scripts/languagelist_updater.sh

      - name: Build debug APK
        run: gradle :app_pojavlauncher:assembleDebug

      - name: Stage preview APK
        run: mkdir -p out && cp app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/Blockside-Android-preview.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Blockside-Android-preview
          path: out/Blockside-Android-preview.apk
          if-no-files-found: error
          retention-days: 30
